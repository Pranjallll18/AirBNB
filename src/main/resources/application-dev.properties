spring.application.name=AirBnb

# H2 In-Memory Database for local development
spring.datasource.url=jdbc:h2:mem:airbnb_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible at /api/v1/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.servlet.context-path=/api/v1
server.port=8081

# JWT Secret
jwt.secretKey=dev_secret_key_for_local_testing_only_1234567890abcdef

# Frontend URL
frontend.url=http://127.0.0.1:5500

# Stripe Configuration (test keys)
stripe.secret.key=sk_test_placeholder
stripe.webhook.secret=whsec_test_secret

# Swagger Configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
